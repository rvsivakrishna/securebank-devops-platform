apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: securebank

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:

      containers:

      - name: mysql

        image: mysql:8.4

        ports:
        - containerPort: 3306

        env:

        - name: MYSQL_ROOT_PASSWORD
          value: root123

        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: securebank-config
              key: DB_NAME

        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: securebank-secret
              key: DB_USER

        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: securebank-secret
              key: DB_PASSWORD

        volumeMounts:

        - name: mysql-storage
          mountPath: /var/lib/mysql

      volumes:

      - name: mysql-storage

        persistentVolumeClaim:
          claimName: mysql-pvc
